<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khata Lite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .app {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: fit-content;
    }

    .header {
      background: #1d4ed8;
      color: #fff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .sync-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .sync-btn.offline {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #111;
      font-weight: 600;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .card {
      background: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .card span {
      font-size: 0.78rem;
      color: #6b7280;
      display: block;
      margin-bottom: 4px;
    }

    .card strong {
      font-size: 1.2rem;
    }

    .green { color: #15803d; }
    .red { color: #dc2626; }

    .controls {
      padding: 14px 20px 10px;
      display: flex;
      gap: 8px;
    }

    .controls input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .controls input:focus {
      border-color: #1d4ed8;
    }

    .btn {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-voice { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .btn-whatsapp { background: #16a34a; color: #fff; width: 100%; margin-top: 10px; }
    .btn-light { background: #e5e7eb; color: #374151; }

    .list {
      padding: 8px 20px 20px;
      max-height: 380px;
      overflow-y: auto;
    }

    .customer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .customer-row:hover {
      background: #f8fafc;
    }

    .customer-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .customer-meta {
      font-size: 0.76rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .pending-tag {
      background: #fef3c7;
      color: #b45309;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-left: 6px;
    }

    /* Modals */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 380px;
      border-radius: 14px;
      padding: 20px;
    }

    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: #4b5563;
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.8rem;
      margin-bottom: 10px;
      display: none;
    }

    .voice-status {
      font-size: 0.82rem;
      color: #1d4ed8;
      background: #eff6ff;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .tx-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 12px 0;
      border-top: 1px solid #e5e7eb;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Khata Lite</h1>
    <button id="syncBtn" class="sync-btn" onclick="toggleOffline()">● Online (Synced)</button>
  </div>

  <div class="summary">
    <div class="card">
      <span>You Will Get</span>
      <strong id="totalGet" class="green">₹0</strong>
    </div>
    <div class="card">
      <span>You Will Give</span>
      <strong id="totalGive" class="red">₹0</strong>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search customer..." oninput="render()" />
    <button class="btn btn-voice" onclick="openVoiceModal()" title="Voice Entry">🎤</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add</button>
  </div>

  <div id="customerList" class="list"></div>
</div>

<!-- Add / Voice Entry Modal -->
<div id="addModal" class="modal-bg">
  <div class="modal">
    <h2 id="modalTitle">New Ledger Entry</h2>
    <div id="voiceBox" class="voice-status"></div>
    <div id="formError" class="error-msg"></div>

    <div class="field">
      <label>Customer Name</label>
      <input type="text" id="custName" placeholder="e.g. Ramesh Patel" />
    </div>
    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" id="txAmount" placeholder="e.g. 500" />
    </div>
    <div class="field">
      <label>Transaction Type</label>
      <select id="txType">
        <option value="credit">You Gave (Credit / Udhaar)</option>
        <option value="received">You Got (Payment Received)</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-light" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<!-- Customer Details & Reminder Modal -->
<div id="detailModal" class="modal-bg">
  <div class="modal">
    <h2 id="detailName">Customer</h2>
    <div id="detailBalance" style="font-size: 0.95rem; margin-bottom: 8px;"></div>
    <div id="txHistory" class="tx-list"></div>

    <button id="waBtn" class="btn btn-whatsapp" onclick="sendReminder()">Send WhatsApp + UPI Reminder</button>
    <div class="modal-actions">
      <button class="btn btn-light" onclick="closeModals()">Close</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "khata_lite_data";
  let isOffline = false;
  let activeCustomer = null;

  // Load saved data or start with sample entries
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { id: 1, name: "Ramesh Patel", amount: 500, type: "credit", date: "23 Nov", synced: true },
    { id: 2, name: "Ramesh Patel", amount: 200, type: "received", date: "24 Nov", synced: true },
    { id: 3, name: "Priya Shah", amount: 350, type: "credit", date: "24 Nov", synced: true },
    { id: 4, name: "Karan Mehta", amount: 150, type: "received", date: "24 Nov", synced: true }
  ];

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  // Basic HTML escaping to prevent XSS (TC-10)
  function escapeText(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function toggleOffline() {
    isOffline = !isOffline;
    const btn = document.getElementById("syncBtn");

    if (isOffline) {
      btn.textContent = "○ Offline (Local)";
      btn.classList.add("offline");
    } else {
      // Auto-sync any pending offline entries
      entries.forEach(e => e.synced = true);
      saveToStorage();
      btn.textContent = "● Online (Synced)";
      btn.classList.remove("offline");
      render();
    }
  }

  function getCustomerSummary() {
    const map = {};
    entries.forEach(e => {
      const key = e.name.trim();
      if (!map[key]) map[key] = { name: key, balance: 0, pending: false, list: [] };
      map[key].balance += (e.type === "credit" ? e.amount : -e.amount);
      if (!e.synced) map[key].pending = true;
      map[key].list.push(e);
    });
    return Object.values(map);
  }

  function render() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const customers = getCustomerSummary().filter(c => c.name.toLowerCase().includes(query));

    let totalGet = 0;
    let totalGive = 0;
    customers.forEach(c => {
      if (c.balance > 0) totalGet += c.balance;
      else totalGive += Math.abs(c.balance);
    });

    document.getElementById("totalGet").textContent = "₹" + totalGet;
    document.getElementById("totalGive").textContent = "₹" + totalGive;

    const listEl = document.getElementById("customerList");
    if (customers.length === 0) {
      listEl.innerHTML = `<p style="text-align:center;color:#9ca3af;padding:24px 0;">No entries found.</p>`;
      return;
    }

    listEl.innerHTML = customers.map(c => {
      const balClass = c.balance >= 0 ? "green" : "red";
      const label = c.balance >= 0 ? "Due" : "Advance";
      const pendingBadge = c.pending ? `<span class="pending-tag">Pending Sync</span>` : "";

      return `
        <div class="customer-row" onclick="openDetail('${escapeText(c.name).replace(/'/g, "\\'")}')">
          <div>
            <div class="customer-name">${escapeText(c.name)}${pendingBadge}</div>
            <div class="customer-meta">${c.list.length} transaction(s)</div>
          </div>
          <div class="${balClass}" style="text-align:right;font-weight:600;">
            ₹${Math.abs(c.balance)}
            <div style="font-size:0.72rem;font-weight:400;">${label}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function openAddModal() {
    document.getElementById("modalTitle").textContent = "New Ledger Entry";
    document.getElementById("voiceBox").style.display = "none";
    document.getElementById("formError").style.display = "none";
    document.getElementById("custName").value = "";
    document.getElementById("txAmount").value = "";
    document.getElementById("txType").value = "credit";
    document.getElementById("addModal").classList.add("open");
  }

  function openVoiceModal() {
    openAddModal();
    document.getElementById("modalTitle").textContent = "Voice Quick-Add";
    const voiceBox = document.getElementById("voiceBox");
    voiceBox.style.display = "block";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      voiceBox.textContent = "Voice API not supported in this browser. Try Chrome, or enter manually.";
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    voiceBox.textContent = "Listening... Say e.g. 'Ramesh 400 credit'";
    recognition.start();

    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      parseVoiceText(text);
    };

    recognition.onerror = () => {
      voiceBox.textContent = "Could not hear clearly. Please try again or type manually.";
    };
  }

  function parseVoiceText(text) {
    const voiceBox = document.getElementById("voiceBox");
    const amountMatch = text.match(/\d+/);

    if (!amountMatch) {
      voiceBox.textContent = `Heard: "${text}" — Couldn't detect an amount. Please enter manually.`;
      return;
    }

    const amount = parseInt(amountMatch[0], 10);
    const isReceived = /paid|got|received/i.test(text);
    const name = text.replace(/\d+/g, "").replace(/credit|udhaar|gave|paid|got|received|rupees/gi, "").trim();

    document.getElementById("custName").value = name || "Customer";
    document.getElementById("txAmount").value = amount;
    document.getElementById("txType").value = isReceived ? "received" : "credit";
    voiceBox.textContent = `Heard: "${text}" — Auto-filled below!`;
  }

  function saveEntry() {
    const name = document.getElementById("custName").value.trim();
    const amount = Number(document.getElementById("txAmount").value);
    const type = document.getElementById("txType").value;
    const err = document.getElementById("formError");

    if (!name) {
      err.textContent = "Please enter a customer name.";
      err.style.display = "block";
      return;
    }
    if (!amount || amount <= 0) {
      err.textContent = "Amount must be greater than ₹0.";
      err.style.display = "block";
      return;
    }

    const today = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
    entries.unshift({
      id: Date.now(),
      name,
      amount,
      type,
      date: today,
      synced: !isOffline
    });

    saveToStorage();
    closeModals();
    render();
  }

  function openDetail(name) {
    const customer = getCustomerSummary().find(c => c.name === name);
    if (!customer) return;

    activeCustomer = customer;
    document.getElementById("detailName").textContent = customer.name;

    const status = customer.balance >= 0 ? `Pending Due: ₹${customer.balance}` : `Advance Paid: ₹${Math.abs(customer.balance)}`;
    document.getElementById("detailBalance").innerHTML = `<strong>${status}</strong>`;

    document.getElementById("txHistory").innerHTML = customer.list.map(t => `
      <div class="tx-item">
        <span>${t.date} · ${t.type === "credit" ? "Gave (Credit)" : "Got (Paid)"}</span>
        <strong class="${t.type === "credit" ? "green" : "red"}">₹${t.amount}</strong>
      </div>
    `).join("");

    document.getElementById("waBtn").style.display = customer.balance > 0 ? "block" : "none";
    document.getElementById("detailModal").classList.add("open");
  }

  function sendReminder() {
    if (!activeCustomer || activeCustomer.balance <= 0) return;
    const upiLink = `upi://pay?pa=shop@upi&pn=KhataLite&am=${activeCustomer.balance}&cu=INR`;
    const msg = `Hi ${activeCustomer.name}, friendly reminder that ₹${activeCustomer.balance} is pending in your Khata. Pay easily via UPI: ${upiLink}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
  }

  function closeModals() {
    document.getElementById("addModal").classList.remove("open");
    document.getElementById("detailModal").classList.remove("open");
  }

  render();
</script>
</body>
</html>
